version: '3.0'

services:

  api:
    container_name: bitfly_api
    image: eliezercastro/bit-fly.co:latest
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    networks:
      - default

  nginx:
    restart: unless-stopped
    image: nginx
    ports:
      - "8080:80"
    depends_on:
      - api
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf
    mem_limit: 512m
    networks:
      - default

networks:
  default:


