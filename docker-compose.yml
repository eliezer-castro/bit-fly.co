version: "3.8"

services:
    rabbitmq:
        image: rabbitmq:3-management
        container_name: bit-fly-rabbitmq
        ports:
            - "5672:5672"
            - "15672:15672"
        environment:
            RABBITMQ_DEFAULT_USER: admin
            RABBITMQ_DEFAULT_PASS: admin123
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
        networks:
            - bit-fly-network
    mailhog:
        image: mailhog/mailhog
        container_name: bit-fly-mailhog
        ports:
            - "1025:1025"
            - "8025:8025"
        networks:
            - bit-fly-network

networks:
    bit-fly-network:
        driver: bridge

volumes:
    rabbitmq_data:
